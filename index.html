<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЖК Визионер - Средняя Колтовская 9-11</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">ЖК "Визионер"</div>
            <p>Средняя Колтовская 9-11, Санкт-Петербург</p>
        </div>
    </header>
    
    <section class="hero">
        <div class="hero-content">
            <h1>Старт продаж нового жилого комплекса "Визионер"</h1>
            <button class="btn" id="presentationBtn">Получить презентацию</button>
        </div>
    </section>
    
    <section class="features">
        <div class="container">
            <h2 class="section-title">Преимущества</h2>
            
            <!-- ФОТО НА ВЕСЬ ЭКРАН -->
            <div class="full-screen-gallery">
                <div class="full-screen-photo">
                    <img src="img/photo1.jpg" alt="Фото 1">
                </div>
                <div class="full-screen-photo">
                    <img src="img/photo2.jpg" alt="Фото 2">
                </div>
                <div class="full-screen-photo">
                    <img src="img/photo3.jpg" alt="Фото 3">
                </div>
                <div class="full-screen-photo">
                    <img src="img/photo4.jpg" alt="Фото 4">
                </div>
            </div>
        </div></section>
    
    <section class="form-section">
        <div class="container">
            <h2 class="section-title">Получить презентацию</h2>
            <div class="form-container">
                <form id="presentationForm">
                    <div class="form-group">
                        <label for="name">Ваше имя</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Ваш телефон</label>
                        <input type="tel" id="phone" name="phone" required placeholder="+7 (XXX) XXX-XX-XX">
                    </div>
                    <button type="submit" class="btn">Отправить заявку</button>
                </form>
            </div>
        </div>
    </section>
    
    <footer>
        <div class="container">
            <p>© 2023 ЖК "Визионер". Санкт-Петербург, Средняя Колтовская ул., 9-11</p>
        </div>
    </footer>
    
    <div class="modal" id="successModal">
        <div class="modal-content">
            <span class="close" id="closeModal">×</span>
            <h2>Спасибо за вашу заявку!</h2>
            <p>Наш менеджер свяжется с вами в ближайшее время.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
